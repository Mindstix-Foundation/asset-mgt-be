# ==============================================================================
# Asset Management - AWS SRE / second deployment (same EC2 as prod)
# ------------------------------------------------------------------------------
# Sibling of docker-compose.aws.yml for an alternate branch/deploy.
# Container + image names are prefixed with `sre-` so both stacks can run on
# the same host / git checkout without clashing.
#
# Architecture:
#   ALB :80/:443  ->  sre-nginx (host:8080)  ->  assets.sre.mindstix.com / + /api/*
#        (edge.conf upstreams: sre-asset-mgt-backend, sre-asset-mgt-frontend)
#
# Prerequisites:
#   cd /opt/asset-mgt/sre-nginx && docker-compose up -d --build
#
# Usage:
#   cd /opt/asset-mgt/asset-mgt-be/docker
#   source ./load-ssm-secrets.sh   # or a SRE-specific env with assets.sre.mindstix.com
#   docker-compose -f docker-compose.aws.sre.yml up -d --build
#
# Prod stack (unchanged):
#   docker-compose -f docker-compose.aws.yml up -d --build
#
# Set CORS_ORIGIN / FRONTEND_URL to https://assets.sre.mindstix.com for this stack.
# ==============================================================================

name: sre-asset-mgt

version: "3.9"

services:
  backend:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    image: sre-asset-mgt-backend:20260723-1-0-2
    container_name: sre-asset-mgt-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${ASST_TRACKER_BACKEND_NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${ASST_TRACKER_BACKEND_DATABASE_URL:?ASST_TRACKER_BACKEND_DATABASE_URL is required}
      JWT_SECRET: ${ASST_TRACKER_BACKEND_JWT_SECRET:?ASST_TRACKER_BACKEND_JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${ASST_TRACKER_BACKEND_CORS_ORIGIN:?ASST_TRACKER_BACKEND_CORS_ORIGIN is required}
      FRONTEND_URL: ${ASST_TRACKER_BACKEND_FRONTEND_URL:?ASST_TRACKER_BACKEND_FRONTEND_URL is required}
      COOKIE_SECURE: ${ASST_TRACKER_BACKEND_COOKIE_SECURE:-true}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      UPLOAD_DEST: /app/uploads
      SMTP_HOST: ${ASST_TRACKER_BACKEND_SMTP_HOST:-}
      SMTP_PORT: ${ASST_TRACKER_BACKEND_SMTP_PORT:-587}
      SMTP_USER: ${ASST_TRACKER_BACKEND_SMTP_USER:-}
      SMTP_PASS: ${ASST_TRACKER_BACKEND_SMTP_PASS:-}
      SMTP_FROM: ${ASST_TRACKER_BACKEND_SMTP_FROM:-}
      POSTGRES_HOST: ${ASST_TRACKER_POSTGRES_HOST:-}
      POSTGRES_PORT: ${ASST_TRACKER_POSTGRES_PORT:-5432}
      POSTGRES_DB: ${ASST_TRACKER_POSTGRES_DB:-}
      POSTGRES_USER: ${ASST_TRACKER_POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${ASST_TRACKER_POSTGRES_PASSWORD:-}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - asset-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../../asset-mgt-fe/frontend
      dockerfile: ../../asset-mgt-be/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${ASST_TRACKER_FRONTEND_VITE_API_BASE_URL:-/api}
    image: sre-asset-mgt-frontend:20260723-1-0-2
    container_name: sre-asset-mgt-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - asset-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  backend_uploads:
    driver: local

networks:
  # Created by sre-nginx/docker-compose.yml — start the edge stack first.
  asset-net:
    name: mindstix-edge-net
    external: true
