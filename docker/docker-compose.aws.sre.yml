# ==============================================================================
# Asset Management - AWS SRE / second deployment (same EC2 as prod)
# ------------------------------------------------------------------------------
# Sibling of docker-compose.aws.core.yml for an alternate branch/deploy.
# Container + image names are prefixed with `sre-` so both stacks can run on
# the same host / git checkout without clashing.
#
# Architecture:
#   ALB :80/:443  ->  sre-nginx (host:8080)  ->  assets.sre.mindstix.com / + /api/*
#        (edge.conf upstreams: sre-asset-mgt-backend, sre-asset-mgt-frontend)
#
# Deploy (secrets only needed for `up`, not for `build`):
#   cd /home/ssm-user/asset-mgt/asset-mgt-be/docker
#   docker-compose -f docker-compose.aws.sre.yml build
#   cd /home/ssm-user/asset-mgt
#   source asset-mgt-be/docker/loadsecrets-sre.sh
#   cd asset-mgt-be/docker
#   docker-compose -f docker-compose.aws.sre.yml up -d
#
# Frontend API base is hard-coded to /api. Do not mix Core /backend-asset-tracker/*
# SSM with SRE /sre-* params.
# ==============================================================================

name: sre-asset-mgt

version: "3.9"

services:
  backend:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    image: sre-asset-mgt-backend:20260928-1-1-0
    container_name: sre-asset-mgt-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${SRE_ASST_TRACKER_BACKEND_NODE_ENV:-production}
      PORT: 3000
      # Runtime-only (from loadsecrets-sre.sh). Empty at `build` time is OK.
      DATABASE_URL: ${SRE_ASST_TRACKER_BACKEND_DATABASE_URL:-}
      JWT_SECRET: ${SRE_ASST_TRACKER_BACKEND_JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${SRE_ASST_TRACKER_BACKEND_CORS_ORIGIN:-}
      FRONTEND_URL: ${SRE_ASST_TRACKER_BACKEND_FRONTEND_URL:-}
      COOKIE_SECURE: ${SRE_ASST_TRACKER_BACKEND_COOKIE_SECURE:-true}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      UPLOAD_DEST: /app/uploads
      SMTP_HOST: ${SRE_ASST_TRACKER_BACKEND_SMTP_HOST:-}
      SMTP_PORT: ${SRE_ASST_TRACKER_BACKEND_SMTP_PORT:-587}
      SMTP_USER: ${SRE_ASST_TRACKER_BACKEND_SMTP_USER:-}
      SMTP_PASS: ${SRE_ASST_TRACKER_BACKEND_SMTP_PASS:-}
      SMTP_FROM: ${SRE_ASST_TRACKER_BACKEND_SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${SRE_ASST_TRACKER_BACKEND_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${SRE_ASST_TRACKER_BACKEND_GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${SRE_ASST_TRACKER_BACKEND_GOOGLE_OAUTH_REDIRECT_URI:-}
      POSTGRES_HOST: ${SRE_ASST_TRACKER_POSTGRES_HOST:-}
      POSTGRES_PORT: ${SRE_ASST_TRACKER_POSTGRES_PORT:-5432}
      POSTGRES_DB: ${SRE_ASST_TRACKER_POSTGRES_DB:-}
      POSTGRES_USER: ${SRE_ASST_TRACKER_POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${SRE_ASST_TRACKER_POSTGRES_PASSWORD:-}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - asset-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../../asset-mgt-fe/frontend
      dockerfile: ../../asset-mgt-be/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: sre-asset-mgt-frontend:20260928-1-1-0
    container_name: sre-asset-mgt-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - asset-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  backend_uploads:
    driver: local

networks:
  # Created by sre-nginx/docker-compose.yml — start the edge stack first.
  asset-net:
    name: mindstix-edge-net
    external: true
