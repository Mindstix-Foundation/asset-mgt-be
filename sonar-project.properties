# SonarQube Configuration for Asset Management Backend (NestJS)
sonar.projectKey=Pebble-Asset-Tracker-Backend
sonar.projectName=Pebble Asset Tracker Backend
sonar.projectVersion=1.0.0
sonar.organization=asset-management

# Source code configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/prisma/migrations/**

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage configuration
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/main.ts,**/prisma/**

# Code quality configuration
sonar.typescript.node=node
sonar.typescript.tsconfigPath=tsconfig.json

# Additional exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/prisma/migrations/**,**/*.d.ts

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis parameters
sonar.host.url=http://localhost:9000
sonar.token=sqp_3174cec18bd950f60db14e99d50cb13e5866116f