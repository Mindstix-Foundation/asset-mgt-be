# SonarQube configuration for Asset Management Backend
sonar.projectKey=asset-mgt-be
sonar.projectName=Asset Management Backend
sonar.projectVersion=1.0.0

# SonarQube server URL
sonar.host.url=http://localhost:9000

# Source code directory
sonar.sources=src

# TypeScript/JavaScript files
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test files
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js

# Exclude node_modules, dist, and other build directories
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.d.ts,prisma/**,uploads/**

# Language settings
sonar.sourceEncoding=UTF-8

# Coverage settings
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js,**/*.d.ts

# TypeScript settings
sonar.typescript.tsconfigPath=tsconfig.json

# ESLint settings
sonar.eslint.reportPaths=eslint-report.json

# Language suffix settings to avoid ambiguity between JS and TS
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx,.cts,.mts
